services:
  mysql:
    image: mysql:8.0
    container_name: community-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=gyh#
      - MYSQL_DATABASE=community_db
      - MYSQL_CHARSET=utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgyh#"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: community-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_NAME=community_db
      - DB_USERNAME=root
      - DB_PASSWORD=gyh#
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - RAG_SERVICE_URL=http://rag-service:8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-community_system_default_secret_key_32_chars}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-shanghai.aliyuncs.com}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-communityclub}
      - OSS_URL_PREFIX=${OSS_URL_PREFIX:-https://communityclub.oss-cn-shanghai.aliyuncs.com/}
      - MAIL_HOST=${MAIL_HOST:-smtp.163.com}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      rag-service:
        condition: service_started
    restart: always

  frontend:
    build: ./frontend
    container_name: community-frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: always

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: community-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  redis:
    image: redis:7.2
    container_name: community-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    restart: always

  rag-service:
    build: ./agent
    image: community-rag-service
    container_name: community-rag
    volumes:
      - ./agent/data:/app/data
      - ./agent/chroma_db:/app/chroma_db
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_URL=https://api.deepseek.com
      - DB_URL=mysql+pymysql://root:gyh%23@mysql:3306/community_db
      - EMBEDDING_PROVIDER=local-hash
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  rag-sync:
    image: community-rag-service
    container_name: community-rag-sync
    command: ["python", "sync_db_loop.py"]
    volumes:
      - ./agent/data:/app/data
    environment:
      - DB_URL=mysql+pymysql://root:gyh%23@mysql:3306/community_db
      - KNOWLEDGE_SYNC_RELOAD_URL=http://rag-service:8000/knowledge/reload
      - KNOWLEDGE_SYNC_INTERVAL_SECONDS=${KNOWLEDGE_SYNC_INTERVAL_SECONDS:-1800}
      - KNOWLEDGE_SYNC_RETRY_DELAY_SECONDS=${KNOWLEDGE_SYNC_RETRY_DELAY_SECONDS:-60}
      - KNOWLEDGE_SYNC_TYPES=${KNOWLEDGE_SYNC_TYPES:-clubs,activities,recruits,notices,resources}
      - KNOWLEDGE_SYNC_PRUNE=${KNOWLEDGE_SYNC_PRUNE:-true}
    depends_on:
      mysql:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: community-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: community-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:
