spring.application.name=Community

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 数据库配置
# 生产环境必须通过环境变量 DB_HOST / DB_NAME / DB_USERNAME / DB_PASSWORD 注入
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:community_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:gyh#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=CommunityHikariPool

# SQL 初始化配置
spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data-mock.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none

# JPA配置
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis配置
# 生产环境必须通过环境变量 REDIS_HOST / REDIS_PASSWORD 注入
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Redis 哨兵（高可用）— 启用时注释掉上方 host/port，取消注释以下配置
# spring.data.redis.sentinel.master=${REDIS_SENTINEL_MASTER:mymaster}
# spring.data.redis.sentinel.nodes=${REDIS_SENTINEL_NODES:sentinel1:26379,sentinel2:26379,sentinel3:26379}
# spring.data.redis.sentinel.password=${REDIS_SENTINEL_PASSWORD:}

# RabbitMQ配置
# 生产环境必须通过环境变量 RABBITMQ_HOST / RABBITMQ_USERNAME / RABBITMQ_PASSWORD 注入
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# JWT配置
# 生产环境必须通过环境变量 JWT_SECRET 注入，且长度不少于 32 位随机字符串
jwt.secret=${JWT_SECRET:community_system_default_secret_key_32_chars}
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 日志配置
logging.level.com.cloud.community=INFO
logging.level.org.springframework.security=WARN

# DeepSeek API Configuration
rag.service.url=${RAG_SERVICE_URL:http://localhost:8000}
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:}

# Aliyun OSS Configuration
# 生产环境必须通过环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 注入
aliyun.oss.endpoint=${OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
aliyun.oss.access-key-id=LTAI5tJsVstsWhdFqUuH4EhG
aliyun.oss.access-key-secret=5uiTe61Xyi06bNZMpoh6I90HCSmOEO
aliyun.oss.bucket-name=${OSS_BUCKET_NAME:communityclub}
aliyun.oss.url-prefix=${OSS_URL_PREFIX:https://communityclub.oss-cn-shanghai.aliyuncs.com/}

# Mail Configuration
# 生产环境必须通过环境变量 MAIL_USERNAME / MAIL_PASSWORD 注入
spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=true

# Monitoring Configuration
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# Cookie 安全配置
# 生产环境启用 HTTPS 后，将 COOKIE_SECURE 设为 true，COOKIE_SAME_SITE 设为 Strict
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# HTTPS / SSL（本地开发无需启用；生产部署时提供 keystore 并取消注释）
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEY_STORE:classpath:keystore.p12}
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=community

# 优雅关机：等待进行中的请求完成后再退出
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s



