spring.application.name=Community

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/community_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=gyh#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL 初始化配置 (每次启动都执行)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-mock.sql
spring.sql.init.encoding=UTF-8
# 禁用 Hibernate 自动建表，完全依赖 schema.sql
spring.jpa.hibernate.ddl-auto=none

# JPA配置
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# JWT配置
jwt.secret=community-secret-key-for-jwt-token-generation-please-change-in-production
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 日志配置
logging.level.com.cloud.community=DEBUG
logging.level.org.springframework.security=DEBUG
